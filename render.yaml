services:
  - type: web
    name: raleigh-renter-api
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENAI_MODEL
        value: gpt-5.6
      - key: ALLOWED_ORIGINS
        value: https://wayan.com,https://www.wayan.com
      - key: CACHE_TTL_HOURS
        value: "6"
      - key: REQUEST_LIMIT
        value: "12"
      - key: REQUEST_WINDOW_MS
        value: "600000"
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
